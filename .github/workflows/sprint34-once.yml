name: sprint34-once
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCI_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      CCI_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check identity configuration
        run: |
          test -n "$CCI_IDENTITY_PROVIDER"
          test -n "$CCI_SERVICE_ACCOUNT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.CCI_IDENTITY_PROVIDER }}
          service_account: ${{ env.CCI_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Execute Sprint 34
        env:
          CCI_SPREADSHEET_ID: "104Op_SgmViFl5sMxY5RcpShAS7J7s6CKo2cGHMqQMCw"
          CCI_MODE: sprint34
          CCI_ANALYSIS_DATE: "2026-11-20"
        run: python -m campaign.production
      - uses: actions/upload-artifact@v4
        with:
          name: sprint34-evidence-${{ github.run_id }}
          path: |
            run-output/metrics.json
            run-output/publication_status.json
          if-no-files-found: error
