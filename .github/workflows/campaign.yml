name: campaign
on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "External snapshot identifier; generated from run ID when omitted"
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: collector-car-campaign
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate to Google with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Execute production pipeline
        env:
          CCI_SPREADSHEET_ID: "104Op_SgmViFl5sMxY5RcpShAS7J7s6CKo2cGHMqQMCw"
          CCI_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          CCI_TRANSACTION_RANGE: "A1:Q28059"
        run: python -m campaign.production
      - name: Verify aggregate-only artifact
        run: test ! -e run-output/raw_rows.csv
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-evidence-${{ github.run_id }}
          path: run-output
          if-no-files-found: error
